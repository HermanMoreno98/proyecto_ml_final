# ============================================================
# docker-compose.yml — Stack MLOps: Airflow + MLflow + PostgreSQL
# ============================================================
# Servicios:
#   mlflow            — Tracking server + Model Registry
#   airflow-init      — Inicialización de la base de datos de Airflow
#   airflow-web       — UI de Airflow
#   airflow-scheduler — Scheduler de Airflow
#   streamlit         — Dashboard interactivo
#
# Prerequisito: copia .env.example a .env y rellena tus credenciales AWS.
#
# Uso rápido:
#   cp .env.example .env   # edita con tus credenciales AWS
#   docker-compose up -d
#
#   Airflow UI   → http://localhost:8080  (admin / admin)
#   MLflow UI    → http://localhost:5001
#   Streamlit    → http://localhost:8501
# ============================================================

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: airflow-custom:latest
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    PYTHONPATH: /opt/airflow
    MLFLOW_TRACKING_URI: http://mlflow:5000
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./config:/opt/airflow/config
    - ./data:/opt/airflow/data
    - airflow_logs:/opt/airflow/logs
    - airflow_plugins:/opt/airflow/plugins
  depends_on:
    postgres:
      condition: service_healthy

services:

  # ------------------------------------------------------------------
  # PostgreSQL — backend de Airflow y MLflow
  # ------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # ------------------------------------------------------------------
  # MLflow — Tracking server + Model Registry (artefactos en AWS S3)
  # ------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    env_file: .env
    command:
      - bash
      - -c
      - |
        pip install --no-cache-dir boto3 psycopg2-binary &&
        mlflow server \
          --host 0.0.0.0 \
          --port 5000 \
          --backend-store-uri postgresql+psycopg2://airflow:airflow@postgres/mlflow \
          --default-artifact-root s3://${MLFLOW_ARTIFACTS_BUCKET:-mlflow-artifacts}/ \
          --serve-artifacts
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  # ------------------------------------------------------------------
  # Airflow — inicialización
  # ------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db upgrade &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com &&
        airflow variables set MLFLOW_TRACKING_URI http://mlflow:5000 &&
        airflow variables set MLFLOW_EXPERIMENT_NAME cu_venta_e2e &&
        airflow variables set MLFLOW_MODEL_NAME cu_venta_xgb &&
        airflow variables set S3_BUCKET_RAW ${S3_BUCKET_RAW} &&
        airflow variables set S3_PREFIX_RAW ${S3_PREFIX_RAW:-raw/} &&
        airflow variables set HPO_N_TRIALS 30 &&
        airflow variables set PSI_ALERT_THRESHOLD 0.25 &&
        airflow variables set DATA_SOURCE ${DATA_SOURCE:-s3}
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"

  # ------------------------------------------------------------------
  # Airflow — Webserver (UI)
  # ------------------------------------------------------------------
  airflow-web:
    <<: *airflow-common
    command: airflow webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ------------------------------------------------------------------
  # Airflow — Scheduler
  # ------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

  # ------------------------------------------------------------------
  # Dashboard Streamlit (imagen custom desde Dockerfile raíz)
  # ------------------------------------------------------------------
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ./data:/app/data
      - ./mlartifacts:/app/mlartifacts
    depends_on:
      - mlflow
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# ------------------------------------------------------------------
# Volúmenes persistentes
# ------------------------------------------------------------------
volumes:
  postgres_data:
  airflow_logs:
  airflow_plugins:
