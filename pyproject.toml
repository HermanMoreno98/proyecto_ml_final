[project]
name = "proyecto-ml-final"
version = "0.1.0"
description = "Pipeline ML E2E — CU Venta: preprocesamiento, entrenamiento HPO, monitoreo PSI y réplica"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # Datos y S3
    "boto3>=1.34.0",
    "s3fs>=2024.1.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    # ML
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    # HPO
    "optuna>=3.6.0",
    # MLflow
    "mlflow>=2.13.0",
    # Visualización (dashboard / reporting)
    "matplotlib>=3.8.0",
    "streamlit>=1.35.0",
    # Config
    "pyyaml>=6.0",
    # Airflow (instalación separada — ver docker/docker-compose.yml)
    # "apache-airflow>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "ipykernel>=6.0.0",
    "jupyter>=1.0.0",
]
dashboard = [
    "streamlit>=1.35.0",
]

[project.scripts]
ml-pipeline = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.black]
line-length = 100
target-version = ["py39"]

